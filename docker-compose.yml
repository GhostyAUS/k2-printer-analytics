version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=k2_analytics
      - POSTGRES_USER=k2user
      - POSTGRES_PASSWORD=k2pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - k2-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U k2user -d k2_analytics"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://k2user:k2pass@db:5432/k2_analytics
      - MOONRAKER_HOST=192.168.1.146
      - MOONRAKER_PORT=7125
      - POWER_POLL_INTERVAL=5
      - ELECTRICITY_RATE_KWH=0.49
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    networks:
      - k2-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://192.168.1.203:8000
    depends_on:
      - backend
    networks:
      - k2-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:

networks:
  k2-network:
    driver: bridge
